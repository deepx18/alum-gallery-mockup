<!DOCTYPE html>
<html lang="en" class="js">
<head>
  <meta charset="utf-8">
  <base href="../">
  <link rel="stylesheet" href="css/styles.css">
  <style>body{padding:40px}.cta,.site-header{display:none}</style>
</head>
<body>
  <h1 style="font-family:var(--font-ui);font-size:14px">project cards in isolation</h1>

      <a class="project-card__link" href="#">

        </div>
        <div class="project-card__body">
          <p class="project-card__meta">Financial services</p>
          <h3 class="project-card__title">Aperture Capital</h3>
          <p class="project-card__text">One workspace for portfolio reviews.</p>
        </div>
      </a>
    </article>
    <article class="project-card">
      <a class="project-card__link" href="#">
        <div class="project-card__media">

        </div>
        <div class="project-card__body">
          <p class="project-card__meta">Healthcare</p>
          <h3 class="project-card__title">Vantage Health</h3>

    </article>
    <article class="project-card">
      <a class="project-card__link" href="#">
        <div class="project-card__media">
          <img src="https://images.unsplash.com/photo-1444723121867-7a241cacace9?auto=format&fit=crop&w=1000&h=750&q=75" alt="three" width="1000" height="750">
        </div>
        <div class="project-card__body">
          <p class="project-card__meta">Logistics</p>
          <h3 class="project-card__title">Corridor Freight</h3>
          <p class="project-card__text">Dispatch and tracking in one place.</p>
        </div>
      </a>
    </article>
  </div>
</body>
</html>
